<title>Portal Upe</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: brand-blue access screen; client area = header + tab strip + cards; admin = sidebar + work area. Data-dense, calm, brand tokens. */
:root {
  --azul: #0C4F7F; --creme: #F2F0E1; --ardosia: #798EA6; --cinza: #A6A9AF; --tinta: #111111;
  --bg: #F5F4EC; --bg-2: #ECEADF; --card: #FFFFFF; --fg: #172431; --fg-2: #56636F; --line: #DEDACA;
  --acc: #0C4F7F; --acc-fg: #F2F0E1; --side: #0E1B27; --side-fg: #E9E7D8;
  --ok: #2F8F5B; --ok-bg: #DDF0E4; --warn: #A86A00; --warn-bg: #FBEFD3; --bad: #B23B3B; --bad-bg: #F7DEDE; --info: #0C4F7F; --info-bg: #DCE8F3; --mute-bg: #ECEAE1;
  --font: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1721; --bg-2: #13212E; --card: #152434; --fg: #E9E7D8; --fg-2: #A3AFBB; --line: #263849; --acc: #9DB6D3; --acc-fg: #0D1721; --side: #0A121A;
  --ok: #7BCB9C; --ok-bg: #173327; --warn: #E8B656; --warn-bg: #3A2D12; --bad: #E58C8C; --bad-bg: #3A1C1C; --info: #9DB6D3; --info-bg: #1B3147; --mute-bg: #1C2B3A; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0D1721; --bg-2: #13212E; --card: #152434; --fg: #E9E7D8; --fg-2: #A3AFBB; --line: #263849; --acc: #9DB6D3; --acc-fg: #0D1721; --side: #0A121A;
  --ok: #7BCB9C; --ok-bg: #173327; --warn: #E8B656; --warn-bg: #3A2D12; --bad: #E58C8C; --bad-bg: #3A1C1C; --info: #9DB6D3; --info-bg: #1B3147; --mute-bg: #1C2B3A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--acc); }
img, video { max-width: 100%; display: block; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 1.7rem; font-weight: 900; } h2 { font-size: 1.3rem; font-weight: 900; } h3 { font-size: 1.05rem; font-weight: 900; }
p { margin: 0; }
.wm { display: block; height: 100%; width: auto; fill: currentColor; }
.eb { font-size: .7rem; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: var(--ardosia); }
.muted { color: var(--fg-2); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
.hide { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; align-content: start; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
.g2 > *, .g3 > *, .g4 > * { min-width: 0; }

/* controles */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 900 .88rem var(--font); padding: 10px 16px; border-radius: 999px; border: 1.5px solid transparent; background: var(--acc); color: var(--acc-fg); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.sec { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ok { background: var(--ok); color: #fff; } .btn.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .lnk:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible, .nav a:focus-visible, .chip:focus-visible, [tabindex]:focus-visible { outline: 2.5px solid var(--ardosia); outline-offset: 2px; }
.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--acc); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
label.f { display: grid; gap: 5px; font-size: .78rem; font-weight: 900; letter-spacing: .04em; color: var(--fg-2); min-width: 0; }
input, select, textarea { font: 400 .95rem var(--font); color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 80px; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--azul); flex: none; }
.tg { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: .92rem; cursor: pointer; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
.tg small { display: block; font-weight: 400; color: var(--fg-2); font-size: .78rem; }
.card.grid { align-content: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.card.pad0 { padding: 0; overflow: hidden; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 900; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--mute-bg); color: var(--fg-2); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: var(--creme); }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 26px; text-align: center; color: var(--fg-2); display: grid; gap: 8px; justify-items: center; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); font-weight: 900; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--bg-2); }
.code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-weight: 700; letter-spacing: .08em; }
.bar { height: 8px; background: var(--bg-2); border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.demo { background: var(--warn-bg); color: var(--warn); font-size: .82rem; padding: 8px 16px; text-align: center; }
.demo b { font-weight: 900; }
.asadm { background: var(--side); color: var(--side-fg); font-size: .85rem; padding: 8px 16px; display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
.asadm a { color: var(--creme); font-weight: 900; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--side); color: var(--side-fg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }

/* acesso */
.gate { min-height: 100vh; background: var(--azul); color: var(--creme); display: grid; place-items: center; padding: 32px 16px; position: relative; overflow: hidden; }
.gate .pat { position: absolute; inset: -130px; background-size: 130px 130px; opacity: .12; }
.gate .box { position: relative; width: min(440px, 100%); display: grid; gap: 22px; text-align: center; justify-items: center; }
.gate .logo { height: 34px; color: var(--creme); }
.gate h1 { font-size: 2rem; }
.gate p { opacity: .85; }
.codein { display: flex; gap: 8px; align-items: center; justify-content: center; width: 100%; }
.codein input { width: 100%; max-width: 110px; text-align: center; font: 900 1.35rem ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; padding: 14px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--creme); color: var(--tinta); }
.codein span { font-weight: 900; opacity: .6; }
.gate .btn { background: var(--creme); color: var(--azul); width: 100%; padding: 14px; font-size: 1rem; }
.gate .err { background: rgba(178,59,59,.25); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.gate .alt { font-size: .88rem; opacity: .85; }
.gate .alt button { color: var(--creme); }
.gate form { display: grid; gap: 12px; width: 100%; }
.gate input.pl { background: var(--creme); color: var(--tinta); border: 0; padding: 13px 14px; font-size: 1rem; border-radius: 12px; }

/* área do cliente */
.cl-top { background: var(--azul); color: var(--creme); }
.cl-top .in { max-width: 1120px; margin: 0 auto; padding: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cl-top .logo { height: 22px; color: var(--creme); }
.cl-top .who { margin-left: auto; text-align: right; font-size: .85rem; }
.cl-top .who b { display: block; font-size: 1rem; }
.cl-top .btn.sec { color: var(--creme); border-color: rgba(242,240,225,.35); }
.tabs { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.tabs .in { max-width: 1120px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; background: none; border: 0; font: 700 .9rem var(--font); color: var(--fg-2); padding: 14px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; }
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--azul); }
.tab .cnt { background: var(--warn-bg); color: var(--warn); font-size: .7rem; font-weight: 900; padding: 1px 7px; border-radius: 999px; }
.cl-main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 18px; }

/* painel admin */
.adm { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-fg); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side .logo { height: 20px; color: var(--creme); margin: 4px 10px 20px; }
.nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--side-fg); text-decoration: none; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: .92rem; opacity: .82; }
.nav a:hover { background: rgba(242,240,225,.06); opacity: 1; }
.nav a[aria-current="page"] { background: var(--azul); opacity: 1; }
.nav a .cnt { background: var(--creme); color: var(--azul); font-size: .7rem; font-weight: 900; padding: 1px 7px; border-radius: 999px; }
.side .foot { margin-top: auto; font-size: .8rem; opacity: .7; padding: 10px; display: grid; gap: 8px; }
.side .foot button { color: var(--side-fg); }
.work { padding: 26px clamp(16px, 3vw, 36px) 60px; display: grid; gap: 18px; align-content: start; min-width: 0; }
@media (max-width: 860px) {
  .adm { grid-template-columns: 1fr; }
  .side { position: sticky; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; overflow-x: auto; z-index: 20; }
  .side .logo { margin: 0 12px 0 4px; flex: none; }
  .side .nav { display: flex; gap: 2px; } .nav a { white-space: nowrap; padding: 8px 10px; }
  .side .foot { margin: 0 0 0 auto; display: flex; padding: 0 4px; white-space: nowrap; }
}
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.stat { display: grid; gap: 4px; }
.stat b { font-size: 1.6rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--fg-2); font-weight: 700; }

/* calendário */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .dow { font-size: .7rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg-2); }
.cal .day { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal .day.out { background: var(--bg-2); opacity: .55; }
.cal .day .d { font-size: .78rem; font-weight: 900; color: var(--fg-2); }
.cal .day.today .d { color: var(--azul); }
.ev { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--fg-2); background: var(--mute-bg); color: var(--fg); font: 700 .74rem var(--font); padding: 4px 6px; border-radius: 6px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.ok { border-color: var(--ok); background: var(--ok-bg); } .ev.warn { border-color: var(--warn); background: var(--warn-bg); } .ev.bad { border-color: var(--bad); background: var(--bad-bg); } .ev.info { border-color: var(--info); background: var(--info-bg); }
@media (max-width: 700px) { .cal { display: none; } }
.agenda { display: grid; gap: 8px; }
.agi { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.agi .dt { font-weight: 900; font-size: .85rem; line-height: 1.2; }
.agi .dt small { display: block; font-weight: 700; color: var(--fg-2); font-size: .72rem; }

/* mídia / gráficos */
.thumb { aspect-ratio: 4 / 3; background: var(--bg-2); border-radius: 12px; overflow: hidden; display: grid; place-items: center; color: var(--fg-2); font-weight: 700; font-size: .85rem; text-align: center; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
.media-box { background: var(--tinta); border-radius: 12px; overflow: hidden; display: grid; place-items: center; min-height: 160px; }
.media-box img, .media-box video { max-height: 60vh; width: auto; }
.media-box audio { width: calc(100% - 24px); margin: 24px 12px; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .88rem; margin: 0; }
.spec dt { color: var(--fg-2); font-weight: 700; } .spec dd { margin: 0; }
.legenda { white-space: pre-wrap; background: var(--bg-2); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }

/* inbox */
.thread { display: flex; flex-direction: column; gap: 10px; max-height: 56vh; overflow-y: auto; padding: 4px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: .93rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg small { display: block; font-size: .72rem; opacity: .7; margin-top: 4px; }
.msg.me { align-self: flex-end; background: var(--azul); color: var(--creme); border-bottom-right-radius: 4px; }
.msg.them { align-self: flex-start; background: var(--bg-2); border-bottom-left-radius: 4px; }
.compose { display: flex; gap: 8px; align-items: flex-end; }
.compose textarea { min-height: 48px; }

/* apresentação */
.player { background: var(--tinta); border-radius: 14px; overflow: hidden; }
.player .stage { aspect-ratio: 16 / 9; position: relative; display: grid; place-items: center; background: #0A0A0A; color: var(--creme); }
.player .stage img, .player .stage video { width: 100%; height: 100%; object-fit: contain; }
.player .stage .ph { padding: 30px; text-align: center; opacity: .7; }
.player .pbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: var(--creme); }
.player .pbar button { background: rgba(242,240,225,.12); color: var(--creme); border: 0; border-radius: 999px; padding: 8px 14px; font: 900 .85rem var(--font); cursor: pointer; }
.player .pbar .nm { flex: 1; min-width: 0; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .igg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; height: 100%; padding: 14px; overflow-y: auto; align-content: start; }
.player .igg button { border: 0; padding: 0; background: #222; aspect-ratio: 4 / 5; cursor: zoom-in; overflow: hidden; border-radius: 6px; }
.player .igg img { width: 100%; height: 100%; object-fit: cover; }
.rail { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
.rail button { flex: none; width: 120px; border: 2px solid transparent; border-radius: 10px; padding: 0; background: var(--card); cursor: pointer; overflow: hidden; text-align: left; font: 700 .72rem var(--font); color: var(--fg); }
.rail button[aria-current="true"] { border-color: var(--azul); }
.rail .rt { aspect-ratio: 16 / 9; background: var(--bg-2); display: grid; place-items: center; font-size: .7rem; color: var(--fg-2); }
.rail .rt img { width: 100%; height: 100%; object-fit: cover; }
.rail span { display: block; padding: 5px 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* modal */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--card); color: var(--fg); width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(8,20,32,.6); }
dialog .mh { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
dialog .mb { padding: 20px; display: grid; gap: 14px; }
dialog .mf { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--card); }
.x { background: none; border: 0; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--fg-2); padding: 4px 8px; }
.qrbox { background: #fff; padding: 14px; border-radius: 14px; display: inline-block; }
.cc { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; background: var(--bg-2); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; max-height: 90px; overflow-y: auto; }

/* newsletter */
.nl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .nl { grid-template-columns: 1fr; } }
.blk { border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
.blk.sel { border-color: var(--azul); }
.blk .bh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; }
.blk .bh b { flex: 1; font-size: .88rem; }
.blk .bh button { background: none; border: 0; cursor: pointer; color: var(--fg-2); font-size: .95rem; padding: 2px 6px; }
.blk .bb { padding: 4px 12px 12px; display: grid; gap: 10px; }
.preview { background: #E9E7DD; border-radius: 14px; padding: 16px; position: sticky; top: 16px; overflow-x: auto; }
.preview iframe { width: 100%; height: 720px; border: 0; background: #fff; border-radius: 8px; }

/* agenda, sininho, área do cliente com barra lateral */
.wtop { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.wtop .eb { margin-right: auto; }
.bellw { position: relative; }
.bellb { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.bellc { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .7rem; font-weight: 900; display: grid; place-items: center; }
.bellp { position: absolute; right: 0; top: 50px; width: min(400px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.22); z-index: 40; overflow: hidden; }
.belll { max-height: 60vh; overflow-y: auto; }
.belli { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 11px 14px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: .88rem; }
.belli:hover { background: var(--bg-2); }
.belli.new { background: var(--info-bg); }
.bico { width: 9px; height: 9px; border-radius: 50%; background: var(--fg-2); margin-top: 6px; }
.bico.ok { background: var(--ok); } .bico.warn { background: var(--warn); } .bico.bad { background: var(--bad); } .bico.info { background: var(--info); }
.cside { background: var(--azul); }
.cside .nav a[aria-current="page"] { background: var(--creme); color: var(--azul); }
