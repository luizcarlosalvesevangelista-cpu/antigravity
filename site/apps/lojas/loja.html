<style>
/* Loja pública de cada cliente (upe-criativo-lojas.web.app/<endereço>). Lê lojas/<endereço> no Firestore; pedidos entram em lojas/<endereço>/pedidos e o painel da empresa importa. */
:root { --base: #0b1d3a; --dest: #1a73d9; --claro: #5fb3ff; --bg: #f2f5fa; --surface: #fff; --fg: #0d1b33; --muted: #5a6a82; --line: #d8e1ee; --ok: #2f8f5b; --crit: #c2412d; --warn: #a8701a;

.top-btn { border: 1px solid rgba(255,255,255,.3); background: none; color: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.top-btn.cart { background: var(--dest); border-color: var(--dest); }
.top-btn .q { background: #fff; color: var(--dest); border-radius: 999px; padding: 0 7px; margin-left: 6px; font-size: 12px; }
main { padding: 20px 0 60px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; text-decoration: none; color: var(--fg); }
.btn.dest { background: var(--dest); border-color: var(--dest); color: #fff; }

.bn-txt { position: relative; max-width: 560px; display: grid; gap: 8px; justify-items: start; } .pos-centro .bn-txt { justify-items: center; }

.form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }

input, select, textarea { padding: 10px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); width: 100%; }

.pix textarea { font-size: 12px; }
.st { display: flex; gap: 8px; flex-wrap: wrap; }
.st span { padding: 6px 12px; border-radius: 999px; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 700; }
.st span.on { background: var(--dest); color: #fff; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--bg); color: var(--muted); }
.pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); } .pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }

.dlg .i { padding: 22px; display: grid; gap: 10px; align-content: start; }

<div id="app"><div class="centro"><p>Carregando a loja…</p></div></div>

<script type="module">
import { fs, doc, getDoc, getDocs, setDoc, collection, onSnapshot } from "/upe-firebase.js";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const digits = s => String(s ?? "").replace(/\D+/g, "");
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const brl = v => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtD = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "";
const hue = s => { let h = 0; for (const ch of String(s || "")) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2800); };
const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const partes = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
const SLUG = (partes[0] || "").toLowerCase(), BASE = "lojas/" + SLUG;
const K = { cart: `loja:${SLUG}:carrinho`, peds: `loja:${SLUG}:pedidos`, comp: `loja:${SLUG}:comprador` };
let CFG = null, PRODS = [], ST = { tela: "vitrine", classe: "", q: "", ordem: "nome", cupom: "", cupOk: null, pag: "", parc: 1, pedido: null, bn: 0 };
let CART = ls.get(K.cart, []);
const salvarCart = () => ls.set(K.cart, CART);

const precoDe = p => +p.promo > 0 && +p.promo < +p.preco ? +p.promo : +p.preco || 0;
const disp = p => p.estoque == null ? Infinity : Math.max(0, +p.estoque);
const PB = id => PRODS.find(p => p.id === id);
/* variação no carrinho: "<id>~<nome>" vira um produto com nome e estoque próprios */
const prod = chave => { const [id, vn] = String(chave).split("~"), p = PB(id); if (!p || vn == null) return p || null; const v = (p.variacoes || []).find(x => x.nome === vn); return v ? { ...p, id: chave, nome: `${p.nome} · ${vn}`, estoque: v.estoque } : null; };
const temVar = p => (p?.variacoes || []).length > 0;
/* frete por estado, grátis acima de um valor e retirada no local (mesma regra do painel) */
function freteCalc(uf, sub) {
  if (ST.retirada && CFG.retirada?.ativo) return 0;
  if (+CFG.freteGratisAcima > 0 && sub >= +CFG.freteGratisAcima) return 0;
  const u = String(uf || "").trim().toUpperCase(), r = u && (CFG.freteRegras || []).find(x => String(x.ufs || "").toUpperCase().split(/[^A-Z]+/).includes(u));
  return r ? +r.valor || 0 : +CFG.frete || 0;
}
const ufAtual = () => ($("#c-uf")?.value || ls.get(K.comp, {}).uf || "").trim();
/* horário de funcionamento (Brasília) */
function horario() {
  const DS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  if (CFG.fechada) return { aberta: false, bloqueia: true, msg: CFG.horarios?.msg || "Loja fechada no momento." };
  const h = CFG.horarios; if (!h?.ativo) return { aberta: true };
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Sao_Paulo", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  const dia = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), min = (+p.hour % 24) * 60 + +p.minute, m = x => { const [a, b] = String(x || "").split(":"); return +a * 60 + +(b || 0); };
  const [ab, fe] = h.dias?.[dia] || []; if (ab && fe && min >= m(ab) && min < m(fe)) return { aberta: true };
  let prox = ""; for (let i = 0; i < 8; i++) { const d = (dia + i) % 7, [a] = h.dias?.[d] || []; if (a && (i > 0 || m(a) > min)) { prox = `${i === 0 ? "hoje" : i === 1 ? "amanhã" : DS[d]} às ${a}`; break; } }
  return { aberta: false, bloqueia: h.fora === "bloquear", msg: h.msg || "Estamos fora do horário de atendimento.", proxima: prox };
}
const horarioHtml = () => { const h = horario(); return h.aberta ? "" : `<div class="aviso-hor ${h.bloqueia ? "bloq" : ""}">${esc(h.msg)}${h.proxima ? ` Abrimos ${esc(h.proxima)}.` : ""}${h.bloqueia ? "" : " Você pode pedir agora: atendemos na abertura."}</div>`; };
const foto = (p, cls = "") => p.imagem ? `<img class="${cls}" src="${esc(p.imagem)}" alt="" loading="lazy">` : `<span class="ph ${cls}" style="--h:${hue(p.classe || p.nome)}" aria-hidden="true">${esc((p.nome || "?").trim().slice(0, 2).toUpperCase())}</span>`;
function pags() { const p = CFG.pag || {}, l = []; if (p.pix) l.push("PIX"); if (p.cartao) l.push("Cartão de crédito"); if (p.boleto) l.push("Boleto"); return l.length ? l : ["A combinar"]; }
function parcelas(total) { const c = CFG.pag?.cartao; if (!c) return []; const out = []; for (let n = 1; n <= Math.max(1, c.parcelas || 1); n++) { const i = (c.juros || 0) / 100, j = n > (c.semJuros || 1) && i > 0, parc = j ? total * i / (1 - Math.pow(1 + i, -n)) : total / n; out.push({ n, parcela: +parc.toFixed(2), total: +(parc * n).toFixed(2), juros: j }); } return out; }
function totais() {
  const it = CART.map(x => ({ ...x, p: prod(x.pid) })).filter(x => x.p);
  const sub = +it.reduce((a, x) => a + precoDe(x.p) * x.qtd, 0).toFixed(2);
  let frete = it.length ? freteCalc(ufAtual(), sub) : 0;
  const c = ST.cupOk, descCup = c ? (c.tipo === "pct" ? +(sub * Math.min(100, c.valor) / 100).toFixed(2) : c.tipo === "valor" ? Math.min(sub, c.valor) : 0) : 0;
  if (c?.tipo === "frete") frete = 0;
  const lp = pags(); if (!lp.includes(ST.pag)) ST.pag = lp[0];
  const descPix = ST.pag === "PIX" && CFG.pag?.pix?.desconto > 0 ? +((sub - descCup) * CFG.pag.pix.desconto / 100).toFixed(2) : 0;
  const base = +(sub - descCup - descPix + frete).toFixed(2), ps = ST.pag === "Cartão de crédito" ? parcelas(base) : [], pc = ps.find(x => x.n === +ST.parc) || ps[0];
  return { it, sub, frete, descCup, descPix, base, ps, pc, total: pc ? pc.total : base, n: it.reduce((a, x) => a + x.qtd, 0) };
}
/* PIX copia e cola (BR Code estático) */
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, "0"); }
function pixCode(valor, txid) {
  const p = CFG.pag.pix, a = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 .\-]/g, "").trim(), f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const body = f("00", "01") + f("26", f("00", "br.gov.bcb.pix") + f("01", p.chave)) + f("52", "0000") + f("53", "986") + (valor > 0 ? f("54", (+valor).toFixed(2)) : "") + f("58", "BR") + f("59", a(p.nome).slice(0, 25).toUpperCase()) + f("60", a(p.cidade).slice(0, 15).toUpperCase()) + f("62", f("05", String(txid).replace(/[^A-Za-z0-9]/g, "").slice(0, 25))) + "6304";
  return body + crc16(body);
}
const pixHtml = (valor, txid) => { const c = pixCode(valor, txid); return `<div class="pix"><div class="qr" data-qr="${esc(c)}"></div><div style="display:grid;gap:8px;align-content:start"><b>Pague com PIX · ${brl(valor)}</b><span style="color:var(--muted);font-size:13px">Para ${esc(CFG.pag.pix.nome)}. Abra o app do banco, escolha PIX › Ler QR Code ou Copia e cola.</span><textarea readonly rows="4">${esc(c)}</textarea><button type="button" class="btn sm" data-copiar="${esc(c)}">Copiar código PIX</button></div></div>`; };
new MutationObserver(() => document.querySelectorAll("[data-qr]:not([data-ok])").forEach(el => { el.dataset.ok = 1; try { new QRCode(el, { text: el.dataset.qr, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M }); } catch { el.textContent = "Use o copia e cola"; } })).observe(document.body, { childList: true, subtree: true });

  const pedido = { ...c, itens: t.it.map(x => ({ pid: x.pid, nome: x.p.nome, qtd: x.qtd, unit: precoDe(x.p) })), sub: t.sub, frete: t.frete, desconto: +(t.descCup + t.descPix).toFixed(2), cupom: ST.cupOk ? ST.cupom : "", total: t.total, entrega: ret ? "retirada" : "entrega", pagamento: ST.pag, parcelas: t.pc ? t.pc.n : 1, obs: ($("#c-obs")?.value || "").trim().slice(0, 500), status: "novo", importado: false, criadoEm: new Date().toISOString() };
  $("#fim-btn").disabled = true; $("#fim-btn").textContent = "Enviando…";
  try {

    location.href = `/${SLUG}/pedido/${id}`;

}
document.addEventListener("click", async e => {
  const b = e.target.closest("button, .scrim"); if (!b) return; const d = b.dataset;
  if (d.fechar && (e.target === b || b.tagName === "BUTTON")) { $("#modal").innerHTML = ""; return; }
  if (d.ir) { $("#modal").innerHTML = ""; return ir(d.ir); }
  if (d.cls != null) { ST.classe = d.cls; ST.q = ""; return render(); }
  if (d.ver) return verProduto(d.ver);
  if (d.add) return add(d.add);
  if (d.addq) { const q = Math.max(1, parseInt($("#v-q").value, 10) || 1), vv = $("#v-var")?.value; $("#modal").innerHTML = ""; return add(vv ? d.addq + "~" + vv : d.addq, q); }
  if (d.compartilhar) { const p = PB(d.compartilhar), url = `${location.origin}/${SLUG}/p/${encodeURIComponent(d.compartilhar)}`, txt = `${p?.nome || ""} · ${brl(precoDe(p || {}))} na ${CFG.nome}`;
    if (navigator.share) { try { await navigator.share({ title: p?.nome, text: txt, url }); } catch {} } else { window.open(`https://wa.me/?text=${encodeURIComponent(txt + "\n" + url)}`, "_blank", "noopener"); } return; }
  if (d.qtd) { const [pid, n] = d.qtd.split(":"); return add(pid, +n); }
  if (d.del) { CART = CART.filter(i => i.pid !== d.del); salvarCart(); return render(); }
  if (d.cupx) { ST.cupom = ""; ST.cupOk = null; return render(); }
  if (d.bn) { ST.bn = +d.bn; return render(); }
  if (d.bnAcao) { const bb = CFG.banners[+d.bnAcao]; if (bb.acao === "link" && /^https?:\/\//.test(bb.alvo)) { window.open(bb.alvo, "_blank", "noopener"); return; } if (bb.acao === "classe") { ST.classe = bb.alvo; return render(); } return; }
  if (d.copiar) { try { await navigator.clipboard.writeText(d.copiar); toast("Código PIX copiado"); } catch { toast("Selecione o código e copie"); } }
});
document.addEventListener("submit", e => {
  if (e.target.id === "f-ir") return;
  e.preventDefault();
  if (e.target.id === "f-busca") { ST.q = $("#q").value.trim(); ST.classe = ""; ST.tela = "vitrine"; render(); }
  if (e.target.id === "f-cup") aplicarCupom($("#cup").value);
  if (e.target.id === "f-fim") finalizar();
});
document.addEventListener("change", e => {
  if (e.target.id === "ordem") { ST.ordem = e.target.value; render(); }
  if (e.target.name === "pag") { ST.pag = e.target.value; ST.parc = 1; guardarForm(); render().then(restaurarForm); }
  if (e.target.id === "parc") { ST.parc = +e.target.value; guardarForm(); render().then(restaurarForm); }
  if (e.target.id === "c-cep") buscarCep(e.target.value);
  if (e.target.name === "ent") { ST.retirada = e.target.value === "retirada"; guardarForm(); render().then(restaurarForm); }
  if (e.target.id === "c-uf" && (CFG.freteRegras || []).length) { guardarForm(); render().then(restaurarForm); }
});
let FORM = {};
const guardarForm = () => document.querySelectorAll("#f-fim input:not([type=radio]), #f-fim textarea").forEach(i => FORM[i.id] = i.value);
const restaurarForm = () => Object.entries(FORM).forEach(([k, v]) => { const i = document.getElementById(k); if (i) i.value = v; });
async function buscarCep(v) {
  const c = digits(v); if (c.length !== 8) return;
  try { const r = await (await fetch(`https://viacep.com.br/ws/${c}/json/`)).json(); if (r.erro) return; const s = (k, val) => { const i = $("#c-" + k); if (i && !i.value && val) i.value = val; }; s("endereco", r.logradouro); s("bairro", r.bairro); s("cidade", r.localidade); s("uf", r.uf); $("#c-numero")?.focus(); } catch {}
}
function indisponivel(titulo, texto) { document.title = titulo; $("#app").innerHTML = `<div class="centro"><div><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div></div>`; }
(async () => {
  if (!SLUG) {   /* endereço principal: não é uma loja, só explica e encaminha */
    document.title = "Lojas Upe Criativo";
    $("#app").innerHTML = `<div class="centro"><div style="display:grid;gap:14px;max-width:520px;justify-items:center"><h1>Lojas Upe Criativo</h1>
      <p>Cada loja tem o próprio endereço, no formato <b style="color:var(--fg)">${esc(location.host)}/nome-da-loja</b>. Se você recebeu o link de uma loja, abra o link completo.</p>
      <form id="f-ir" style="display:flex;gap:8px;width:100%"><input id="ir-loja" placeholder="nome-da-loja" aria-label="Endereço da loja" autocapitalize="none"><button type="submit" class="btn dest">Abrir loja</button></form>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><a class="btn" href="https://upe-criativo-painel.web.app">Sou lojista: abrir o painel</a><a class="btn" href="https://upe-criativo-erp.web.app">Quero uma loja assim</a></div></div></div>`;
    $("#f-ir").addEventListener("submit", e => { e.preventDefault(); const n = norm($("#ir-loja").value).trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); if (n) location.href = "/" + n; }, true);
    return;
  }
  try {
    const raiz = await getDoc(doc(fs, BASE));
    if (!raiz.exists()) return indisponivel("Loja não encontrada", "Confira o endereço digitado.");
    const r = raiz.data();
    if (r.mudouPara) { location.replace("/" + r.mudouPara + location.pathname.slice(SLUG.length + 1)); return; }
    const c = await getDoc(doc(fs, BASE + "/publico/config"));
    CFG = c.exists() ? c.data() : { nome: r.nome || "Loja" };
    if (r.ativa === false || CFG.ativa === false) return indisponivel(CFG.nome || "Loja", "Loja temporariamente indisponível. Volte em breve.");
    PRODS = (await getDocs(collection(fs, BASE + "/produtos"))).docs.map(d => ({ id: d.id, ...d.data() }));
    CART = CART.filter(x => prod(x.pid));
    /* carrinho vindo de uma página do cliente feita com o Kit Upe: ?add=<produto>:<qtd>,… */
    const qs = new URLSearchParams(location.search), add = qs.get("add");
    if (add) {
      add.split(",").forEach(par => { const [pid, q] = par.split(":"), n = Math.min(99, Math.max(1, parseInt(q) || 1)); if (!prod(pid)) return; const x = CART.find(i => i.pid === pid); if (x) x.qtd = n; else CART.push({ pid, qtd: n }); });
      salvarCart(); history.replaceState(null, "", "/" + SLUG); ST.tela = "carrinho"; render(); return;
    }
    /* página inicial personalizada (landing page do Painel Upe Serviços ligada a esta loja); ?vitrine=1 abre a vitrine padrão */
    const kVit = `loja:${SLUG}:vitrine`;
    if (qs.has("vitrine")) { try { sessionStorage.setItem(kVit, "1"); } catch {} history.replaceState(null, "", "/" + SLUG); }
    if (!partes[1] && !qs.has("vitrine") && !(() => { try { return sessionStorage.getItem(kVit); } catch { return null; } })()) {
      const capa = await getDoc(doc(fs, BASE + "/publico/capa")).catch(() => null);
      const lp = capa?.exists() ? capa.data().lp : "";
      if (lp) {
        const pg = await getDoc(doc(fs, "lp_paginas/" + lp)).catch(() => null);
        if (pg?.exists() && pg.data().html) {
          const { montar } = await import("https://upe-criativo-lp.web.app/lp-render.js");
          const d = pg.data(); document.open(); document.write(montar(d.html, { ...d, vinculos: { ...(d.vinculos || {}), loja: SLUG } }, lp)); document.close(); return;
        }
      }
    }
    if (partes[1] === "p" && partes[2]) { history.replaceState(null, "", "/" + SLUG); render(); setTimeout(() => verProduto(partes[2]), 50); return; }
    if (partes[1] === "pedido" && partes[2]) {
      const id = partes[2]; ST.tela = "pedido";
      DESL = onSnapshot(doc(fs, `${BASE}/pedidos/${id}`), s => { ST.pedido = { id, d: s.exists() ? s.data() : null }; render(); }, () => { ST.pedido = { id, d: null }; render(); });
      return;
    }
    render();
  } catch (e) { console.error(e); indisponivel("Loja indisponível", "Não foi possível carregar a loja agora. Tente de novo em instantes."); }
})();
