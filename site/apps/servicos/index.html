<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex">
<title>Painel Upe Serviços</title>
<meta name="theme-color" content="#0b1d3a">
<link rel="icon" type="image/png" href="/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Painel Upe Serviços: mesma identidade do painel da loja (Upe ERP). */
:root {
  --bg: #f2f5fa; --surface: #ffffff; --surface-2: #e7edf6; --fg: #0d1b33; --muted: #5a6a82; --line: #d8e1ee;
  --accent: #1a73d9; --accent-ink: #0f4fa0; --accent-2: #5fb3ff; --on-accent: #ffffff;
  --side-bg: #0b1d3a; --side-fg: #eef3fb; --side-muted: #8fa3c2; --side-hover: #16305a;
  --ok: #2f8f5b; --ok-bg: #e3f3ea; --warn: #a8701a; --warn-bg: #fbf0dc; --crit: #c2412d; --crit-bg: #fae4df; --info: #2a7fa8; --info-bg: #e2f1f8;
  --bar: #1a73d9; --grid: #e3e9f2;
  --shadow: 0 1px 2px rgba(13,27,51,.06), 0 4px 16px rgba(13,27,51,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1426; --surface: #111f38; --surface-2: #182a48; --fg: #e8eefa; --muted: #9aabc6; --line: #22375c;
  --accent: #5fb3ff; --accent-ink: #8cc8ff; --accent-2: #8cc8ff; --on-accent: #0a1426;
  --side-bg: #071022; --side-fg: #e8eefa; --side-muted: #8396b5; --side-hover: #13274a;
  --ok: #5cc48a; --ok-bg: #1f3a2b; --warn: #e3b049; --warn-bg: #3b301a; --crit: #ee7a66; --crit-bg: #432520; --info: #6cc1e8; --info-bg: #1b3340;
  --bar: #5fb3ff; --grid: #1d3050; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a1426; --surface: #111f38; --surface-2: #182a48; --fg: #e8eefa; --muted: #9aabc6; --line: #22375c;
  --accent: #5fb3ff; --accent-ink: #8cc8ff; --accent-2: #8cc8ff; --on-accent: #0a1426;
  --side-bg: #071022; --side-fg: #e8eefa; --side-muted: #8396b5; --side-hover: #13274a;
  --ok: #5cc48a; --ok-bg: #1f3a2b; --warn: #e3b049; --warn-bg: #3b301a; --crit: #ee7a66; --crit-bg: #432520; --info: #6cc1e8; --info-bg: #1b3340;
  --bar: #5fb3ff; --grid: #1d3050; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-ink); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* estrutura */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-fg); position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; padding: 20px 14px; display: flex; flex-direction: column; gap: 16px; z-index: 30; }
.side-brand { padding: 0 8px; display: grid; gap: 2px; }
.side-brand h1 { font-family: var(--f-display); font-size: 28px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.side-brand h1 b { color: var(--accent-2); }
.side-brand span { color: var(--side-muted); font-size: 13px; }
.side-quem { border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; }
.side-quem select { background: var(--side-hover); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 6px 8px; color: var(--side-fg); }
.nav { display: grid; gap: 2px; }
.nav h4 { margin: 12px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 10px; border: 0; background: none; color: var(--side-fg); font-weight: 600; }
.nav button:hover { background: var(--side-hover); }
.nav button[aria-current="page"] { background: var(--side-fg); color: var(--side-bg); }
.nav .tag { font-size: 11px; font-weight: 700; background: var(--crit); color: #fff; border-radius: 99px; padding: 1px 7px; }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.side-foot button, .side-foot a { background: none; border: 1px solid rgba(255,255,255,.18); color: var(--side-fg); border-radius: 10px; padding: 8px 12px; font-weight: 600; text-decoration: none; text-align: center; }
.main { min-width: 0; padding: 20px clamp(16px, 3vw, 32px) 120px; display: grid; gap: 18px; align-content: start; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topo h2 { font-family: var(--f-display); font-size: 30px; text-transform: uppercase; letter-spacing: .03em; }
.topo .acoes { display: flex; gap: 8px; flex-wrap: wrap; }

/* peças */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card h3 { font-family: var(--f-display); font-size: 21px; text-transform: uppercase; letter-spacing: .04em; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.kpi b { font-family: var(--f-display); font-size: 34px; line-height: 1.05; font-weight: 700; }
.kpi span { color: var(--muted); font-size: 12.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 700; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.azul { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.perigo { color: var(--crit); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.crit { background: var(--crit-bg); color: var(--crit); } .pill.info { background: var(--info-bg); color: var(--info); }
.banner { background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius: 12px; padding: 12px 16px; font-size: 13.5px; }
.banner b { color: inherit; }
label.f { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea, .in-txt { padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 14px; min-width: 0; width: 100%; }
label.chk { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.form { display: grid; gap: 12px; }
.linha { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabela th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tabela td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabela tr:last-child td { border-bottom: 0; }
.rolar { overflow-x: auto; }
.vazio { padding: 28px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.abas button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.abas button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.passos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.passo { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); text-align: left; }
.passo i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; background: var(--surface-2); color: var(--muted); font-size: 12px; }
.passo.ok i { background: var(--ok); color: #fff; }
.passo b { display: block; } .passo span { color: var(--muted); font-size: 12.5px; }
.prog { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; } .prog i { display: block; height: 100%; background: var(--ok); }
.pagina { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.miniatura { width: 120px; aspect-ratio: 4/3; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; background: var(--bg); position: relative; }
.miniatura iframe { width: 1200px; height: 900px; transform: scale(.1); transform-origin: 0 0; border: 0; pointer-events: none; }
code.end { font-size: 12.5px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; word-break: break-all; }

/* editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.palco { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.palco-barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tela { margin: 0 auto; width: 100%; height: 72vh; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.12); transition: width .25s; }
.tela.cel { width: 390px; max-width: 100%; }
.tela iframe { width: 100%; height: 100%; border: 0; display: block; }
textarea.codigo { width: 100%; min-height: 62vh; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #0b1426; color: #dbe7ff; tab-size: 2; }
.barra-salvar { position: fixed; left: 280px; right: 16px; bottom: 16px; z-index: 40; background: var(--side-bg); color: var(--side-fg); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: 0 16px 40px rgba(0,0,0,.3); }
.barra-salvar .btn { border-color: rgba(255,255,255,.25); background: transparent; color: var(--side-fg); }
.barra-salvar .btn.azul { background: var(--accent-2); color: #0b1d3a; border-color: var(--accent-2); }

/* gráfico */
.graf { position: relative; }
.graf svg { width: 100%; height: 220px; display: block; overflow: visible; }
.graf .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); box-shadow: var(--shadow); }
.barras-h { display: grid; gap: 8px; }
.barras-h div { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13px; }
.barras-h .t { display: grid; gap: 4px; min-width: 0; } .barras-h .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barras-h .t i { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--bar); min-width: 2px; }
.barras-h b { text-align: right; }

/* diálogo e aviso */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--surface); color: var(--fg); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(5, 12, 26, .55); }
dialog form.d { padding: 22px; display: grid; gap: 14px; max-height: 86vh; overflow: auto; }
dialog h3 { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 700; z-index: 300; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* login */
#login { position: fixed; inset: 0; z-index: 200; background: radial-gradient(80% 60% at 100% 0%, #16305a, #0b1d3a 60%); display: grid; place-items: center; padding: 16px; overflow: auto; }
.lg-box { background: var(--surface); color: var(--fg); border-radius: 18px; padding: 28px; width: min(420px, 100%); display: grid; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.lg-box h1 { font-family: var(--f-display); font-size: 30px; text-transform: uppercase; letter-spacing: .03em; }
.lg-box h1 b { color: var(--accent); }
.lg-err { color: var(--crit); font-weight: 700; font-size: 13.5px; } .lg-ok { color: var(--ok); font-weight: 700; font-size: 13.5px; }
.lg-err:empty, .lg-ok:empty { display: none; }
.lg-link { background: none; border: 0; color: var(--accent-ink); font-weight: 600; padding: 0; justify-self: start; }
.lg-sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; } .lg-sep::before, .lg-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }

@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; }
  .nav { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .nav h4 { grid-column: 1 / -1; }
  .editor, .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .barra-salvar { left: 16px; }
  .pagina { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-brand"><h1>Upe <b>Serviços</b></h1><span>Landing pages · Agenda · Dashboards</span></div>
    <div class="side-quem" id="quem"></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="side-foot"><a href="https://upe-criativo.web.app/portal/" id="lnkPortal">Portal Upe</a><button type="button" id="btnSair">Sair</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script type="module" src="painel.js"></script>
</body>
</html>
