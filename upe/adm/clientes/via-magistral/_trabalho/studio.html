<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estúdio de motion · Via Magistral</title>
<!--
  Estúdio de motion da Via Magistral (padrão Upe: 30 fps, 16:9 e 9:16, trilha e efeitos por cues).
  Abra studio.html?motion=logo&fmt=v&play para ver uma peça no navegador.
  render.js chama window.__render(t) quadro a quadro e lê __duration, __cues e __poster.
  Peças: logo (h, v) · r1-receita (v) · r2-voce-sabia (v) · r3-unidades (v) · filme (v, h)
-->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vm-brand.js"></script>
<style>
:root{--royal:#112250;--gold:#C6A75E;--saphire:#3C5070;--shell:#D9C8C2;--swan:#F5F0E9;--ink:#0b1638}
*{box-sizing:border-box;margin:0}
html,body{background:#000;overflow:hidden}
#st{position:relative;overflow:hidden;font-family:Poppins,sans-serif;color:var(--swan);background:var(--royal)}
.L{position:absolute;inset:0}
.pat{position:absolute;-webkit-mask:var(--m) 0 0/var(--ps,220px) repeat;mask:var(--m) 0 0/var(--ps,220px) repeat}
svg.vm{display:block;overflow:visible}
svg.vm path{transform-box:fill-box}
svg.vm .s0{transform-origin:0% 100%} svg.vm .s1{transform-origin:50% 50%} svg.vm .s2{transform-origin:50% 100%}
svg.vm .s3{transform-origin:50% 50%} svg.vm .s4,svg.vm .s5,svg.vm .s6{transform-origin:0 50%}
.t{position:absolute;font-weight:700;letter-spacing:-.025em;line-height:1.06}
.t em{font-style:normal;font-weight:300}
.k{position:absolute;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.ab{position:absolute}
</style>
</head>
<body>
<div id="st"></div>
<script>
const Q=new URLSearchParams(location.search),ID=Q.get('motion')||'logo',FMT=Q.get('fmt')||'v';
const W=FMT==='h'?1920:1080,H=FMT==='h'?1080:1920,V=FMT==='v';
const st=document.getElementById('st');st.style.width=W+'px';st.style.height=H+'px';
document.documentElement.style.setProperty('--m',`url(${VM_PATTERN})`);
const C={royal:'#112250',gold:'#C6A75E',saphire:'#3C5070',shell:'#D9C8C2',swan:'#F5F0E9'};
/* ---------- utilidades ---------- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={o3:x=>1-Math.pow(1-x,3),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back:x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lin:x=>x};
const p=(t,a,b,e='o3')=>E[e](cl((t-a)/(b-a)));
const el=(html,parent=st)=>{const d=document.createElement('div');d.innerHTML=html.trim();const n=d.firstElementChild;parent.appendChild(n);return n};
function logoSVG(kind,cls=''){const L=VM[kind];
  return `<svg class="vm ${cls}" viewBox="${L.vb}" fill="currentColor">${L.sym.map((d,i)=>`<path class="s${i}" d="${d}"/>`).join('')}${L.word.map((d,i)=>`<path class="w" data-i="${i}" d="${d}"/>`).join('')}${L.tag.map((d,i)=>`<path class="tg" data-i="${i}" d="${d}"/>`).join('')}</svg>`}
/* coreografia do logotipo: a mesma do motion aprovado (tigela, faixas, pilão que cai e mói, nome, assinatura) */
function logoAt(svg,t){
  const q=svg.querySelectorAll('path');
  q.forEach(n=>{const c=n.getAttribute('class'),i=+n.dataset.i||0;let tr='',op=1;
    if(c==='s1'){tr=`scaleX(${p(t,0,.55)})`}
    else if(c==='s2'){tr=`scaleY(${p(t,.2,.95)})`}
    else if(c==='s3'){tr=`scale(${p(t,.7,1.2,'back')})`}
    else if(/s[456]/.test(c)){const k=+c[1]-4;tr=`scaleX(${p(t,1+.14*k,1.55+.14*k)})`}
    else if(c==='s0'){const d=p(t,1.6,2.2,'back'),u=cl((t-2.25)/1);let g=0;if(u>0&&u<1){g=u<.3?-7*u/.3:u<.65?-7+11*(u-.3)/.35:4-4*(u-.65)/.35}
      tr=`translateY(${-140*(1-d)}%) rotate(${-14*(1-d)+g}deg)`;op=cl((t-1.6)/.25)}
    else if(c==='w'){const d=p(t,2.45+i*.045,3.1+i*.045);tr=`translateY(${45*(1-d)}%)`;op=d}
    else if(c==='tg'){const d=p(t,3.15+i*.018,3.65+i*.018);tr=`translateX(${-30*(1-d)}%)`;op=d}
    n.style.transform=tr;n.style.opacity=op})}
const LOGO_CUES=o=>[{t:o+.05,s:'swoosh'},{t:o+.75,s:'pop'},{t:o+1.0,s:'tap'},{t:o+1.14,s:'tap'},{t:o+1.28,s:'tap'},{t:o+2.12,s:'thud'},{t:o+2.3,s:'draw',d:.9},{t:o+2.45,s:'logo'}];
const pat=(color,op=1,size=220,extra='')=>`<div class="pat" style="background:${color};opacity:${op};--ps:${size}px;${extra}"></div>`;
function fade(n,t,a,b,{dy=40,dx=0,f=.45,fo=.35}={}){const i=p(t,a,a+f),o=b==null?0:p(t,b-fo,b,'io');n.style.opacity=i*(1-o);n.style.transform=`translate(${dx*(1-i)}px,${dy*(1-i)-dy*.5*o}px)`}
const fs=(v,h)=>V?v:h;
/* trilha e quadros de capa */
window.__cues=[];window.__duration=10;window.__poster=null;let R=()=>{};

/* ===================== PEÇAS ===================== */
const PIECES={
/* ---------- LOGO REVEAL (10 s) ---------- */
logo(){
  __duration=10;__poster=7.5;
  const band=el(`<div class="ab" style="left:0;right:0;top:0;height:${fs(300,220)}px;overflow:hidden">${pat(C.gold,.9,fs(620,560),'inset:0')}</div>`);
  const band2=el(`<div class="ab" style="left:0;right:0;bottom:0;height:${fs(300,220)}px;overflow:hidden">${pat(C.gold,.9,fs(620,560),'inset:0')}</div>`);
  const lg=el(`<div class="ab" style="left:50%;top:${fs(46,46)}%;width:${fs(700,620)}px;transform:translate(-50%,-50%);color:${C.swan}">${logoSVG('v')}</div>`);
  const tag=el(`<div class="t" style="left:0;right:0;text-align:center;top:${fs(1270,770)}px;font-size:${fs(54,46)}px;font-weight:500">Sua fórmula, <em style="color:${C.gold}">do seu jeito.</em></div>`);
  const svg=lg.querySelector('svg');
  __cues=[...LOGO_CUES(.6),{t:4.5,s:'sparkle'},{t:.1,s:'rise',d:.8}];
  R=t=>{const b=p(t,0,.9,'io');band.style.transform=`translateY(${-100*(1-b)}%)`;band2.style.transform=`translateY(${100*(1-b)}%)`;
    band.firstElementChild.style.backgroundPosition=`${t*18}px 0`;band2.firstElementChild.style.backgroundPosition=`${-t*18}px 0`;
    logoAt(svg,t-.6);fade(tag,t,4.4,null,{dy:30});
    const z=1+.03*p(t,4,10,'lin');lg.style.transform=`translate(-50%,-50%) scale(${z})`;
    const out=p(t,9.3,10,'io');st.style.opacity=1-out*0}
},
/* ---------- REEL 1 · ENVIE SUA RECEITA (12 s) ---------- */
'r1-receita'(){
  __duration=12;__poster=1.6;st.style.background=C.saphire;
  const steps=[['Envie a foto da receita','Pelo WhatsApp da unidade mais perto de você.'],['A farmacêutica avalia','Dose, forma e compatibilidade dos ativos.'],['Sua fórmula é manipulada','Do jeito que o seu médico prescreveu.'],['Retire ou receba','Asa Sul · St Sudoeste · Gama.']];
  const top=el(`<div class="k" style="left:80px;top:150px;font-size:30px;color:${C.gold}">Como funciona</div>`);
  const bars=el(`<div class="ab" style="left:80px;right:80px;top:210px;display:flex;gap:16px">${steps.map(()=>`<span style="flex:1;height:8px;border-radius:8px;background:rgba(245,240,233,.22);overflow:hidden"><i style="display:block;height:100%;background:${C.gold};transform-origin:0 50%;transform:scaleX(0)"></i></span>`).join('')}</div>`);
  const sc=steps.map(([a,b],i)=>el(`<div class="ab" style="left:80px;right:80px;top:520px;opacity:0">
     <div style="font-size:300px;font-weight:700;line-height:.8;color:${C.gold};letter-spacing:-.06em">${i+1}</div>
     <div class="t" style="position:relative;margin-top:70px;font-size:104px">${a}</div>
     <div style="margin-top:40px;font-size:44px;font-weight:400;opacity:.85;max-width:840px">${b}</div></div>`));
  const end=el(`<div class="L" style="background:${C.royal};opacity:0">${pat(C.gold,.85,620,'left:0;right:0;top:0;height:260px')}<div class="ab" style="left:50%;top:44%;width:640px;transform:translate(-50%,-50%);color:${C.swan}">${logoSVG('v')}</div><div class="t" style="left:0;right:0;top:1180px;text-align:center;font-size:58px;font-weight:500">Peça seu orçamento<br><em style="color:${C.gold}">pelo WhatsApp.</em></div></div>`);
  __cues=[{t:.1,s:'rise'},...steps.map((_,i)=>({t:.35+i*2.3,s:'swoosh'})),...steps.map((_,i)=>({t:.6+i*2.3,s:'check'})),{t:9.4,s:'whoosh'},{t:9.6,s:'logo'}];
  R=t=>{fade(top,t,0,9.4,{dy:20});bars.querySelectorAll('i').forEach((n,i)=>n.style.transform=`scaleX(${p(t,.3+i*2.3,2.6+i*2.3,'lin')})`);
    sc.forEach((n,i)=>fade(n,t,.3+i*2.3,2.6+i*2.3,{dy:80}));
    end.style.opacity=p(t,9.3,9.8);end.querySelector('.ab').style.transform=`translate(-50%,-50%) scale(${.92+.08*p(t,9.3,10.4)})`;fade(end.querySelector('.t'),t,10.1,null,{dy:30})}
},
/* ---------- REEL 2 · VOCÊ SABIA? (11 s) ---------- */
'r2-voce-sabia'(){
  __duration=11;__poster=3.2;st.style.background=C.shell;st.style.color=C.royal;
  const facts=['A dose pode ser ajustada ao seu peso, idade e necessidade.','Mais de um ativo pode ir na mesma cápsula, quando a receita permite.','Cremes podem ser feitos sem perfume, pensando em peles sensíveis.'];
  const q=el(`<div class="t" style="left:90px;top:230px;font-size:150px">Você<br><em>sabia?</em></div>`);
  const ln=el(`<div class="ab" style="left:90px;top:610px;width:420px;height:12px;border-radius:8px;background:${C.gold};transform-origin:0 50%"></div>`);
  const fx=facts.map((f,i)=>el(`<div class="ab" style="left:90px;right:120px;top:820px;opacity:0"><div class="k" style="position:relative;font-size:32px">0${i+1} / 03</div><div class="t" style="position:relative;margin-top:36px;font-size:84px">${f}</div></div>`));
  const end=el(`<div class="L" style="background:${C.royal};color:${C.swan};clip-path:inset(100% 0 0 0)"><div class="ab" style="left:50%;top:42%;width:620px;transform:translate(-50%,-50%)">${logoSVG('v')}</div><div class="t" style="left:0;right:0;top:1130px;text-align:center;font-size:56px;font-weight:500">Converse com a nossa<br>farmacêutica.</div><div class="ab" style="left:0;right:0;top:1330px;text-align:center;font-size:30px;opacity:.7">Consulte sempre um profissional de saúde.</div></div>`);
  __cues=[{t:.2,s:'pop'},{t:.6,s:'draw',d:.6},...facts.map((_,i)=>({t:1.1+i*2.6,s:'idea'})),{t:8.8,s:'whoosh'},{t:9.2,s:'success'}];
  R=t=>{fade(q,t,0,null,{dy:50});ln.style.transform=`scaleX(${p(t,.5,1.2)})`;fx.forEach((n,i)=>fade(n,t,1+i*2.6,3.5+i*2.6,{dy:70}));
    const w=p(t,8.7,9.5,'io');end.style.clipPath=`inset(${100*(1-w)}% 0 0 0)`}
},
/* ---------- REEL 3 · NOSSAS UNIDADES (10 s) ---------- */
'r3-unidades'(){
  __duration=10;__poster=7;st.style.background=C.royal;
  const bg=el(`<div class="L" style="overflow:hidden">${pat(C.gold,.2,700,'inset:-200px')}</div>`);
  const h=el(`<div class="t" style="left:90px;top:200px;font-size:110px">Três endereços.<br><em style="color:${C.gold}">O mesmo cuidado.</em></div>`);
  const U=[['Asa Sul','CLS 309, bl. C, loja 33','(61) 3242-1339'],['St Sudoeste','CLSW 104, bl. B, loja 34/36','(61) 3204-4440'],['Gama','St. Hoteleiro, lt 04, lj. 02','(61) 3547-0583']];
  const cards=U.map((u,i)=>el(`<div class="ab" style="left:90px;right:90px;top:${620+i*290}px;background:${C.swan};color:${C.royal};border-radius:28px;padding:40px 48px;display:grid;grid-template-columns:110px 1fr;gap:34px;align-items:center;opacity:0"><div style="width:110px;height:110px;border-radius:50%;background:${C.royal};color:${C.swan};display:grid;place-items:center"><div style="width:70px">${logoSVG('symbol')}</div></div><div><div style="font-weight:700;font-size:50px;letter-spacing:-.02em">${u[0]}</div><div style="font-size:32px;opacity:.8">${u[1]} · ${u[2]}</div></div></div>`));
  const cta=el(`<div class="t" style="left:0;right:0;top:1560px;text-align:center;font-size:46px;font-weight:500">Envie sua receita pelo WhatsApp<br><em style="color:${C.gold}">da unidade mais perto.</em></div>`);
  __cues=[{t:.1,s:'rise'},{t:.3,s:'swoosh'},...U.map((_,i)=>({t:1.5+i*.9,s:'pop'})),{t:4.6,s:'ding'},{t:8,s:'logo'}];
  R=t=>{bg.firstElementChild.style.transform=`translate(${t*12}px,${t*8}px)`;fade(h,t,.1,null,{dy:50});cards.forEach((n,i)=>fade(n,t,1.4+i*.9,null,{dx:-120,dy:0}));fade(cta,t,4.4,null,{dy:30})}
},
/* ---------- FILME DA MARCA · "A fórmula da Helena" (38 s) ---------- */

  /* cena 1: cada pessoa é única */
  const c1=el(`<div class="L" style="background:${C.royal};overflow:hidden">${pat(C.gold,.24,fs(700,640),'inset:-200px')}<div class="t" style="left:${fs(90,180)}px;top:${fs(700,340)}px;font-size:${fs(130,120)}px">Cada pessoa<br><em style="color:${C.gold}">é única.</em></div></div>`);

  const c2=el(`<div class="L" style="background:${C.shell};color:${C.royal}"><div class="ab pp" style="left:${fs(240,1080)}px;top:${fs(260,150)}px;width:${fs(600,560)}px;transform:rotate(-4deg)">${paper}</div><div class="t" style="left:${fs(90,170)}px;top:${fs(1340,380)}px;font-size:${fs(84,84)}px;max-width:${fs(900,820)}px">A receita da Helena foi feita <em>para ela.</em></div></div>`);

  const c6=el(`<div class="L" style="background:${C.shell};color:${C.royal}"><div class="ab bt" style="left:50%;top:${fs(36,40)}%;width:${fs(440,360)}px;transform:translate(-50%,-50%)">${bottle}<div style="position:absolute;left:${fs(80,66)}px;top:${fs(220,180)}px;width:${fs(140,114)}px;color:${C.swan}">${logoSVG('h')}</div></div><div class="t" style="left:0;right:0;text-align:center;top:${fs(1300,860)}px;font-size:${fs(76,68)}px">Pronta para retirar<br><em>ou receber em casa.</em></div></div>`);
  /* cena 7: assinatura */
