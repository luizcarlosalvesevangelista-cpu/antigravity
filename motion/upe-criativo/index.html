<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: a single 16:9 stage on brand ink, with a slim transport bar and spec line beneath */
:root {
  --azul: #0C4F7F;       /* cor primária */
  --creme: #F2F0E1;      /* cor primária */
  --ardosia: #798EA6;    /* cor secundária */
  --cinza: #A6A9AF;      /* cor secundária */
  --tinta: #111111;      /* cor de destaque */
  --page: #0B0E12;
  --line: #262B33;
  --muted: #8A919B;
  --font-body: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--creme); font-family: var(--font-body); padding: 32px 16px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: .01em; text-wrap: balance; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ardosia); font-weight: 700; }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--azul); }
.stage svg { display: block; width: 100%; height: 100%; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar button { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--creme); font: 700 .85rem var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer; min-width: 92px; }
.bar button:hover { border-color: var(--ardosia); }
.bar button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--ardosia); outline-offset: 2px; }
#scrub { flex: 1 1 220px; min-width: 0; accent-color: var(--ardosia); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; min-width: 96px; text-align: right; }
.specs { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); padding-top: 14px; }
.specs b { color: var(--creme); font-weight: 700; }
.swatches { display: flex; gap: 6px; align-items: center; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid var(--line); }
/* render mode: stage fills the viewport for frame capture */
body.render { padding: 0; background: var(--azul); }
body.render .wrap { max-width: none; display: block; }
body.render header, body.render .bar, body.render .specs { display: none; }
body.render .stage { position: fixed; inset: 0; border-radius: 0; aspect-ratio: auto; }
</style>

      <rect id="fadeIn" width="1920" height="1080" fill="#F2F0E1" opacity="0"/>

  </div>

  <div class="bar">
    <button id="play" type="button">Pausar</button>
    <button id="restart" type="button">Reiniciar</button>
    <input id="scrub" type="range" min="0" max="9" step="0.01" value="0" aria-label="Posição na animação">
    <span class="time" id="time">0,0 s / 9,0 s</span>
  </div>

  <div class="specs">
    <span><b>1920 × 1080</b> · 16:9</span>
    <span><b>9 s</b> · loop contínuo</span>
    <span><b>30 fps</b></span>
    <span class="swatches" aria-label="Paleta usada"><i style="background:#0C4F7F"></i><i style="background:#F2F0E1"></i><i style="background:#798EA6"></i><i style="background:#A6A9AF"></i><i style="background:#111111"></i></span>
    <span>Vetores e cores extraídos do manual da marca</span>
  </div>
</div>

<script>
(() => {
  const D = 9, NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = (p, s = 1.6) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
  const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const mix = (c1, c2, p) => {
    const a = c1.match(/\w\w/g).map(h => parseInt(h, 16)), b = c2.match(/\w\w/g).map(h => parseInt(h, 16));
    return "#" + a.map((v, i) => Math.round(lerp(v, b[i], p)).toString(16).padStart(2, "0")).join("");
  };
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

  // Padrão de foguetes (ativo da marca), em diagonal
  const pattern = $("pattern"), STEP = 130;
  for (let gy = -2; gy < 11; gy++) for (let gx = -2; gx < 17; gx++) {
    const x = gx * STEP + (gy % 2 ? STEP / 2 : 0), y = gy * STEP * 0.75;
    el("use", { href: "#rocketShape", transform: `translate(${x} ${y}) rotate(45) scale(1.7) translate(-804.4 -2620)` }, pattern);
  }

  // Linhas de velocidade
  const speed = $("speed"), lines = [];
  for (let i = 0; i < 18; i++) lines.push({ e: el("line", { "stroke-width": 2 + rnd(i) * 3 }, speed), x: 120 + rnd(i + 50) * 1680, len: 90 + rnd(i + 9) * 220, off: rnd(i + 99) * 1400, v: 1800 + rnd(i + 3) * 1600 });

  // Fumaça
  const smoke = $("smoke"), puffs = [];
  for (let i = 0; i < 46; i++) puffs.push({ e: el("circle", { fill: i % 3 ? "#F2F0E1" : "#A6A9AF" }, smoke), tb: 0.25 + i * 0.034, sx: (rnd(i) - .5) * 2, dx: (rnd(i + 7) - .5) * 14, dy: 4 + rnd(i + 13) * 10, r: 2.2 + rnd(i + 21) * 3.5 });

  // Brilhos
  const sparks = $("sparks"), STAR = "M0,-1 C.12,-.12 .12,-.12 1,0 C.12,.12 .12,.12 0,1 C-.12,.12 -.12,.12 -1,0 C-.12,-.12 -.12,-.12 0,-1Z";
  const sparkData = [[392, 352, 34, 3.9], [1520, 330, 26, 4.0], [1585, 700, 38, 4.12], [300, 735, 22, 4.2], [980, 300, 18, 4.28], [760, 790, 24, 4.36]];
  sparkData.forEach(s => s.e = el("path", { d: STAR }, sparks));

  const letters = [...document.querySelectorAll("#letters path")];
  const uGroup = $("uGroup"), rocket = $("rocket"), body = $("rocketBody"), nose = $("nose"), uClipRect = $("uClipRect");

  const rocketDy = t => t < 0.2 ? 110 : lerp(110, 0, easeOutBack(prog(t, 0.2, 1.75), 1.2));

  function render(t) {
    // Fade de entrada (fecha o loop vindo da tela creme)
    $("fadeIn").setAttribute("opacity", (1 - easeOutCubic(prog(t, 0, 0.45))).toFixed(3));

    // Padrão
    const drift = (t * 26) % STEP;
    pattern.setAttribute("transform", `translate(${drift} ${-drift * 0.75})`);
    pattern.setAttribute("opacity", (0.16 - 0.08 * easeInOutCubic(prog(t, 2.4, 3.4))).toFixed(3));

    // Tremor de câmera durante o voo
    const sh = Math.sin(prog(t, 0.3, 1.7) * Math.PI) * 5;
    $("shake").setAttribute("transform", `translate(${(Math.sin(t * 91) * sh).toFixed(2)} ${(Math.cos(t * 77) * sh).toFixed(2)})`);

    // Linhas de velocidade
    const sv = Math.sin(prog(t, 0.2, 1.9) * Math.PI);
    lines.forEach(l => {
      const y = ((l.off + t * l.v) % 1500) - 250;
      l.e.setAttribute("x1", l.x); l.e.setAttribute("x2", l.x);
      l.e.setAttribute("y1", y); l.e.setAttribute("y2", y + l.len);
      l.e.setAttribute("opacity", (sv * 0.35).toFixed(3));
    });

    // Grupo do U: grande no centro, depois vai para a posição do logotipo
    const mv = easeInOutCubic(prog(t, 2.6, 3.5));
    const dock = t > 2.15 ? Math.sin(prog(t, 2.15, 2.55) * Math.PI) * 0.05 : 0;
    const s = lerp(9, 3.2, mv) * (1 + dock), X = lerp(960, 459.36, mv), Y = lerp(560, 540, mv);
    uGroup.setAttribute("transform", `translate(${X.toFixed(2)} ${Y.toFixed(2)}) scale(${s.toFixed(4)}) translate(-804.5 -2622.65)`);

    // Foguete
    const dy = rocketDy(t), hop = -3 * Math.sin(prog(t, 4.9, 5.45) * Math.PI);
    const wob = Math.sin(t * 18) * 2.2 * (1 - prog(t, 0.2, 1.75));
    rocket.setAttribute("transform", `translate(0 ${dy.toFixed(3)}) rotate(${wob.toFixed(2)} 804.4 2620)`);
    nose.setAttribute("transform", `translate(0 ${hop.toFixed(3)})`);
    body.setAttribute("fill", mix("F2F0E1", "0C4F7F", easeInOutCubic(prog(t, 2.05, 2.5))));

    // Chama
    const fa = t < 0.2 ? 0 : clamp(prog(t, 0.2, 0.4) - prog(t, 1.6, 2.1));
    const L = fa * (7 + Math.sin(t * 43) * 1.6 + Math.sin(t * 71) * 1.1), Li = L * 0.55;
    const fy = 2635.2;
    $("flameOuter").setAttribute("d", fa ? `M801.6 ${fy} C801.4 ${fy + L * .45} 803.4 ${fy + L * .8} 804.4 ${fy + L} C805.4 ${fy + L * .8} 807.4 ${fy + L * .45} 807.2 ${fy} Z` : "");
    $("flameInner").setAttribute("d", fa ? `M803 ${fy} C803 ${fy + Li * .5} 803.9 ${fy + Li * .8} 804.4 ${fy + Li} C804.9 ${fy + Li * .8} 805.8 ${fy + Li * .5} 805.8 ${fy} Z` : "");

    // Fumaça (fica para trás, no ponto em que nasceu)
    puffs.forEach(p => {
      const age = t - p.tb;
      if (age < 0 || age > 1.1) { p.e.setAttribute("r", 0); return; }
      const a = age / 1.1, by = 2637 + rocketDy(p.tb);
      p.e.setAttribute("cx", (804.4 + p.sx + p.dx * easeOutCubic(a)).toFixed(2));
      p.e.setAttribute("cy", (by + p.dy * easeOutCubic(a)).toFixed(2));
      p.e.setAttribute("r", (p.r * (0.4 + easeOutCubic(a))).toFixed(2));
      p.e.setAttribute("opacity", ((1 - a) * 0.55).toFixed(3));
    });

    // U sobe e envolve o foguete
    uClipRect.setAttribute("y", lerp(2645.5, 2598, easeOutCubic(prog(t, 1.45, 2.2))).toFixed(2));

    // Onda de choque no encaixe
    const rp = prog(t, 2.15, 2.95);
    $("ring").setAttribute("r", (60 + easeOutCubic(rp) * 760).toFixed(1));
    $("ring").setAttribute("stroke-width", ((1 - rp) * 14).toFixed(2));
    $("ring").setAttribute("opacity", rp > 0 && rp < 1 ? ((1 - rp) * 0.6).toFixed(3) : 0);

    // Letras sobem em sequência
    letters.forEach((e, i) => {
      const p = prog(t, 3.0 + i * 0.07, 3.55 + i * 0.07);
      e.setAttribute("transform", `translate(0 ${(lerp(46, 0, easeOutBack(p, 1.4))).toFixed(3)})`);
    });

    // Brilhos
    sparkData.forEach(([x, y, size, t0], i) => {
      const p = prog(t, t0, t0 + 0.6), k = Math.sin(p * Math.PI) * size;
      sparkData[i].e.setAttribute("transform", `translate(${x} ${y}) rotate(${p * 90}) scale(${k.toFixed(2)})`);
    });

    // Máscara final para a versão creme
    $("wipeCircle").setAttribute("r", (easeInOutCubic(prog(t, 6.6, 7.6)) * 2300).toFixed(1));
  }

  // Reprodução
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const renderMode = location.hash === "#render";
  if (renderMode) document.body.classList.add("render");
  const playBtn = $("play"), scrub = $("scrub"), time = $("time");
  let playing = !reduce && !renderMode, t = reduce ? 6.4 : 0, last = null;
  const fmt = v => v.toFixed(1).replace(".", ",");
  const show = () => { render(t); scrub.value = t; time.textContent = `${fmt(t)} s / ${fmt(D)} s`; playBtn.textContent = playing ? "Pausar" : "Reproduzir"; };
  function tick(now) {
    if (playing) { if (last != null) t = (t + (now - last) / 1000) % D; last = now; show(); }
    else last = null;
    requestAnimationFrame(tick);
  }
  playBtn.addEventListener("click", () => { playing = !playing; show(); });
  $("restart").addEventListener("click", () => { t = 0; playing = true; show(); });
  scrub.addEventListener("input", () => { t = +scrub.value; playing = false; show(); });
  window.__render = v => { t = v; playing = false; render(v); };
  show();
  requestAnimationFrame(tick);
})();
</script>
